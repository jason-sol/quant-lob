name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: astral-sh/setup-uv@v5
      - name: Build and test (ASan+UBSan)
        run: |
          cmake --preset debug-asan
          cmake --build --preset debug-asan
          ctest --preset debug-asan
      - name: Python tools tests
        if: hashFiles('tools/pyproject.toml') != ''
        run: QLOB_REPLAY=$GITHUB_WORKSPACE/build/debug-asan/qlob_replay uv run --project tools pytest tools/tests -q
