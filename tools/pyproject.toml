[project]
name = "qlob-tools"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlob_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
